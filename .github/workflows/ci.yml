name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, typecheck, tests (PostgreSQL service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: touche_commerce
          POSTGRES_USER: touche_admin
          POSTGRES_PASSWORD: ci_admin_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U touche_admin -d touche_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TOUCHE_ENVIRONMENT: test
      TOUCHE_DATABASE_URL: postgresql+psycopg://touche_app:ci_app_pw@127.0.0.1:5432/touche_commerce
      TOUCHE_DATABASE_MIGRATION_URL: postgresql+psycopg://touche_migrator:ci_migrator_pw@127.0.0.1:5432/touche_commerce
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: touche_commerce
      POSTGRES_ADMIN_DB: postgres
      POSTGRES_ADMIN_USER: touche_admin
      POSTGRES_ADMIN_PASSWORD: ci_admin_pw
      TOUCHE_DB_APP_USER: touche_app
      TOUCHE_DB_APP_PASSWORD: ci_app_pw
      TOUCHE_DB_MIGRATOR_USER: touche_migrator
      TOUCHE_DB_MIGRATOR_PASSWORD: ci_migrator_pw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Bootstrap database roles
        run: bash scripts/db/bootstrap-roles.sh

      - name: Bootstrap isolated test database
        run: bash scripts/db/bootstrap-ci-test-database.sh

      - name: Apply Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Ruff
        working-directory: backend
        run: python -m ruff check .

      - name: Mypy
        working-directory: backend
        # Earlier stages have 98 known errors in test helper typing; the shipped app
        # and all runtime modules are checked strictly until that separate debt is resolved.
        run: python -m mypy app

      - name: Pytest (includes live PostgreSQL integration tests)
        working-directory: backend
        run: python -m pytest -v

  frontend:
    name: Frontend · format, lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Prettier check
        working-directory: frontend
        run: npm run format:check

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  api-contract:
    name: API contract · generated types are current
    runs-on: ubuntu-latest
    env:
      TOUCHE_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (no dev extras needed)
        run: python -m pip install -e ./backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Regenerate OpenAPI + TypeScript types
        run: |
          python backend/scripts/export_openapi.py
          cd frontend && npm run api:types

      - name: Fail on contract drift
        run: |
          git diff --exit-code -- frontend/openapi/openapi.json frontend/src/lib/api/schema.d.ts


  windows-scripts:
    name: Windows PowerShell · local scripts parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse startup and verification scripts
        shell: pwsh
        run: |
          foreach ($path in @('scripts/start-local.ps1', 'scripts/verify.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $path"
            }
            Write-Host "Syntax validated: $path"
          }
