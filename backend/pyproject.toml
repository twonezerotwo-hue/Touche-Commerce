[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "touche-commerce-api"
version = "0.1.0"
description = "TOUCHE COMMERCE backend API — Stage 0 foundation (FastAPI + SQLAlchemy + PostgreSQL)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.159,<0.160",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    # Stage 1A identity: Argon2id password hashing + RFC-compliant email parsing.
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.16,<3",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires a reachable PostgreSQL instance (skipped when no database URL is configured)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:multipart.*",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "C4",     # comprehensions
    "S",      # bandit (security)
    "RUF",    # ruff-specific
]
ignore = [
    "B008",  # FastAPI Depends(...) in defaults is the documented pattern
    "S104",  # binding to 0.0.0.0 is a deployment concern, not a code concern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake credentials in tests
"app/core/errors.py" = ["S110"]      # best-effort logging in error paths

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "."
files = ["app", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
